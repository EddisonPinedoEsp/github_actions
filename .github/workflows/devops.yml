name: CI básico Python + Bash
run-name: "CI disparado por ${{ github.actor }}"

on:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - synchronize

jobs:       # ← todos los jobs van anidados aquí
  test:
    runs-on: ubuntu-latest

    outputs:
      build_tag: ${{ steps.meta.outputs.tag }}

    steps:
      # STEP 1: Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # STEP 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # STEP 3: Cache
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      # STEP 4: Install dependencies
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 5: Run tests and generate JUnit/Coverage XML reports
      - name: Run tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          pytest -q \
            --junitxml=report.xml \
            --cov=hello \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # Keep the percentage visible in the run summary and in the logs.
      - name: Publish coverage summary
        if: always()
        run: |
          echo "## Cobertura" >> "$GITHUB_STEP_SUMMARY"
          coverage report --precision=2 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.xml
            coverage.xml
          if-no-files-found: warn

      # STEP 6: Create build tag  ← el step que alimenta outputs.build_tag
      - name: Compute build tag
        id: meta
        run: |
          TS=$(date +%Y%m%d-%H%M%S)
          echo "tag=${TS}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # STEP 7: Save artifact
      - name: Save artifact (sample log)
        run: |
          echo "Build tag: ${{ steps.meta.outputs.tag }}" > build-info.txt
      - name: Upload build info artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt
  package:
    needs: test              # Dependencia: espera a que termine 'test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read tag from previous job
        run: echo "TAG = ${{ needs.test.outputs.build_tag }}"
        env:
          TAG: ${{ needs.test.outputs.build_tag }}

      - name: Create zip
        run: |
          mkdir -p dist
          cp hello.py dist/
          zip -r "app-${{ needs.test.outputs.build_tag }}.zip" dist
          mv "app-${{ needs.test.outputs.build_tag }}.zip" dist/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: app-zip
          path: dist/*.zip
  docs:
    runs-on: ubuntu-latest
    needs: [test, package]
    steps:
      - name: Echo info (Bash)
        run: |
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "Runner: $RUNNER_OS"